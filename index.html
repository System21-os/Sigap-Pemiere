<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

<!-- PENTING: allow="camera" WAJIB ada.
     Izin kamera didelegasikan PER LAPIS iframe. Tanpa atribut ini,
     navigator.mediaDevices.getUserMedia() di dalam SIGAP selalu gagal
     dengan "NotAllowedError: Permission denied" — walaupun user sudah
     mengizinkan kamera di browser. Akibatnya Scan Barcode live mati
     dan aplikasi jatuh ke mode foto. -->
<iframe
  src="https://script.google.com/macros/s/AKfycbzxm8y3H40_nW4sfYsJ5r9Ugs1Hu9sM4kGWDQnzmhc6roVlN0GjKyLMo5e6bHqhayA_/exec"
  allow="camera; fullscreen"
  allowfullscreen></iframe>
</body>
